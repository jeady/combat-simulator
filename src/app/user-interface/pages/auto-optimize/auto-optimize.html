<template id="mcs-auto-optimize-page-template">
    <mcs-page-title
        page-title="Auto-Optimize"
        description="Search your owned gear for the best loadout against the selected target. The objective is whatever plot metric is selected on the Simulate page; loadouts that don't reliably survive are rejected."
    ></mcs-page-title>

    <div class="mcs-auto-optimize-container">
        <div id="mcs-auto-optimize-objective" class="mcs-auto-optimize-objective"></div>

        <div class="mcs-auto-optimize-controls">
            <label class="mcs-auto-optimize-label" for="mcs-auto-optimize-search-trials">Search trials</label>
            <input
                id="mcs-auto-optimize-search-trials"
                class="mcs-auto-optimize-input"
                type="number"
                min="10"
                step="10"
                value="200"
            />
            <label class="mcs-auto-optimize-label" for="mcs-auto-optimize-item-pool">Gear</label>
            <select id="mcs-auto-optimize-item-pool" class="mcs-auto-optimize-select">
                <option value="owned">Owned</option>
                <option value="craftable">Owned or craftable</option>
                <option value="all">All equippable</option>
            </select>
            <label class="mcs-auto-optimize-label" for="mcs-auto-optimize-attack-type">Attack type</label>
            <select id="mcs-auto-optimize-attack-type" class="mcs-auto-optimize-select">
                <option value="current">Keep current</option>
                <option value="any">Any</option>
                <option value="melee">Melee</option>
                <option value="ranged">Ranged</option>
                <option value="magic">Magic</option>
            </select>
            <label class="mcs-auto-optimize-check" for="mcs-auto-optimize-fast-search">
                <input id="mcs-auto-optimize-fast-search" type="checkbox" checked />
                Fast search
            </label>
            <label class="mcs-auto-optimize-label" for="mcs-auto-optimize-restarts">Restarts</label>
            <select
                id="mcs-auto-optimize-restarts"
                class="mcs-auto-optimize-select"
                title="Re-run the search from N different starting loadouts and keep the best — escapes bad starting-gear traps at ~Nx the time."
            >
                <option value="1">1</option>
                <option value="3">3</option>
                <option value="5">5</option>
            </select>
            <label class="mcs-auto-optimize-check" for="mcs-auto-optimize-progression"
                title="After the gear search, run a second pass that tunes your agility course and cartography POI for the best gear.">
                <input id="mcs-auto-optimize-progression" type="checkbox" />
                Also optimize agility &amp; cartography
            </label>
            <button id="mcs-auto-optimize-run" class="mcs-button mcs-auto-optimize-run">Run Optimization</button>
            <button id="mcs-auto-optimize-apply" class="mcs-button mcs-auto-optimize-apply" disabled>
                Apply Best Loadout
            </button>
        </div>

        <div class="text-muted mcs-auto-optimize-hint">
            <strong>Search trials</strong> is how many simulated fights each candidate loadout is judged on while
            searching — fewer is faster but noisier. The single best setup found is then re-tested at your Simulate
            page's full trial count before the result is shown. <strong>Fast search</strong> screens a slot's
            candidates at a fraction of the trials and only re-tests the most promising few at full trials — much
            faster on slots with many options; turn it off for an exhaustive pass.
        </div>

        <details id="mcs-auto-optimize-scope" class="mcs-auto-optimize-scope">
            <summary>Search scope — click a slot to cycle: searched → locked → custom</summary>
            <div class="text-muted mcs-auto-optimize-scope-desc">
                <strong>Searched</strong> slots are optimized; <strong>locked</strong> (🔒) slots keep whatever you
                have equipped; <strong>custom</strong> slots search only the items you hand-pick. Custom is
                available for equipment slots.
            </div>
            <div class="mcs-auto-optimize-scope-actions">
                <button id="mcs-auto-optimize-search-all" class="mcs-button-secondary" type="button">Search all</button>
                <button id="mcs-auto-optimize-lock-all" class="mcs-button-secondary" type="button">Lock all</button>
            </div>
            <div id="mcs-auto-optimize-locks" class="mcs-auto-optimize-locks"></div>
        </details>

        <div id="mcs-auto-optimize-status" class="mcs-auto-optimize-status"></div>
        <div id="mcs-auto-optimize-progress" class="mcs-auto-optimize-progress"></div>

        <div id="mcs-auto-optimize-progressbar" class="mcs-auto-optimize-progressbar" style="display: none">
            <div class="mcs-auto-optimize-progressbar-track">
                <div id="mcs-auto-optimize-progressbar-fill" class="mcs-auto-optimize-progressbar-fill"></div>
            </div>
            <div id="mcs-auto-optimize-eta" class="mcs-auto-optimize-eta"></div>
        </div>

        <div id="mcs-auto-optimize-live" class="mcs-auto-optimize-live-panel" style="display: none">
            <div class="mcs-auto-optimize-live-columns">
                <div class="mcs-auto-optimize-live-col">
                    <div class="mcs-auto-optimize-section-title">Current setup</div>
                    <div id="mcs-auto-optimize-base-caption" class="mcs-auto-optimize-live-caption"></div>
                    <div id="mcs-auto-optimize-base-grid"></div>
                </div>
                <div class="mcs-auto-optimize-live-col">
                    <div id="mcs-auto-optimize-live-title" class="mcs-auto-optimize-section-title">Currently evaluating</div>
                    <div id="mcs-auto-optimize-live-caption" class="mcs-auto-optimize-live-caption"></div>
                    <div id="mcs-auto-optimize-live-grid"></div>
                </div>
            </div>
        </div>

        <div class="mcs-auto-optimize-columns">
            <div id="mcs-auto-optimize-feed-panel" class="mcs-auto-optimize-feed-panel" style="display: none">
                <div class="mcs-auto-optimize-section-title">New bests</div>
                <div class="mcs-auto-optimize-section-desc text-muted">
                    Each time the search finds a setup that beats the current best, it's added here (newest at the
                    bottom). Highlighted slots differ from your current setup.
                </div>
                <div id="mcs-auto-optimize-feed" class="mcs-auto-optimize-feed"></div>
            </div>

            <div id="mcs-auto-optimize-leaderboard-panel" class="mcs-auto-optimize-leaderboard-panel" style="display: none">
                <div class="mcs-auto-optimize-section-title">Top setups</div>
                <div class="mcs-auto-optimize-section-desc text-muted">
                    The highest-scoring setups tried so far, ranked (survivable first; full-trial evaluations only, so
                    quick screening passes can't rank). Includes strong alternatives the search didn't ultimately pick.
                </div>
                <div id="mcs-auto-optimize-leaderboard" class="mcs-auto-optimize-leaderboard"></div>
            </div>
        </div>

        <div id="mcs-auto-optimize-results" class="mcs-auto-optimize-results"></div>

        <mcs-dialog id="mcs-auto-optimize-scope-dialog">
            <div slot="header" id="mcs-auto-optimize-scope-dialog-title"></div>

            <div slot="content">
                <div>
                    <input id="mcs-auto-optimize-scope-search" class="form-control" type="text" placeholder="Search" />
                </div>
                <div class="text-muted mcs-auto-optimize-scope-hint">
                    Click items to select them. The search will only try the selected items for this slot (plus
                    leaving it as it currently is).
                </div>
                <div id="mcs-auto-optimize-scope-items" class="mcs-auto-optimize-scope-items"></div>
            </div>

            <div slot="footer">
                <button id="mcs-auto-optimize-scope-clear" class="mcs-button-secondary">Search all</button>
                <div class="mcs-flex-space"></div>
                <button id="mcs-auto-optimize-scope-save" class="mcs-button">Save</button>
                <button id="mcs-auto-optimize-scope-cancel" class="mcs-button-secondary">Cancel</button>
            </div>
        </mcs-dialog>
    </div>
</template>
